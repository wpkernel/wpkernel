name: Deploy Documentation

on:
    push:
        branches:
            - main
        paths:
            - 'docs/**'
            - 'packages/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/docs.yml'
            - 'scripts/docs/promotion-resolver.cjs'
    workflow_dispatch:

permissions: {}

concurrency:
    group: pages
    cancel-in-progress: true

env:
    NODE_VERSION: '22.20.0'
    PNPM_VERSION: '10.19.0'

jobs:
    admit-main-ref:
        name: Admit main deployment ref
        if: github.repository == 'wpkernel/wpkernel'
        runs-on: ubuntu-latest
        steps:
            - name: Require main
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
                      echo "Documentation deployment is only admitted from refs/heads/main; received ${GITHUB_REF}." >&2
                      exit 1
                  fi

    resolve-source:
        name: Resolve promoted authoring source
        needs: admit-main-ref
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            source-sha: ${{ steps.receipt.outputs.source-sha }}
            source-ci-run-id: ${{ steps.receipt.outputs.source-ci-run-id }}
            source-ci-run-url: ${{ steps.receipt.outputs.source-ci-run-url }}
        steps:
            - name: Check out promotion resolver
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Verify promotion receipt and authoring CI
              id: receipt
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  public_get() {
                      local url=$1
                      local destination=$2
                      local headers="${destination}.headers"
                      local status

                      if ! status="$(
                          curl --silent --show-error --location \
                              --connect-timeout 10 \
                              --max-time 45 \
                              --retry 3 \
                              --retry-all-errors \
                              --retry-delay 2 \
                              --header 'Accept: application/vnd.github+json' \
                              --header 'Cache-Control: no-cache' \
                              --header 'X-GitHub-Api-Version: 2022-11-28' \
                              --dump-header "${headers}" \
                              --output "${destination}" \
                              --write-out '%{http_code}' \
                              "${url}"
                      )"; then
                          echo "Unauthenticated GitHub API request failed before an HTTP response: ${url}" >&2
                          return 1
                      fi
                      node scripts/docs/promotion-resolver.cjs check-public-response \
                          --url "${url}" \
                          --status "${status}" \
                          --headers-file "${headers}" \
                          --body-file "${destination}"
                  }

                  pulls_files=()
                  for page in 1 2 3; do
                      pulls_page_file="${RUNNER_TEMP}/associated-pulls-${page}.json"
                      curl --fail --silent --show-error --location \
                          --connect-timeout 10 \
                          --max-time 45 \
                          --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                          --header 'Accept: application/vnd.github+json' \
                          --header 'X-GitHub-Api-Version: 2022-11-28' \
                          --output "${pulls_page_file}" \
                          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100&page=${page}"
                      pulls_files+=("${pulls_page_file}")
                      page_state="$(node scripts/docs/promotion-resolver.cjs associated-pull-page-state \
                          --page-file "${pulls_page_file}" \
                          --page-number "${page}")"
                      if [[ "${page_state}" == 'complete' ]]; then
                          break
                      fi
                  done
                  pulls_args=()
                  for pulls_file in "${pulls_files[@]}"; do
                      pulls_args+=(--pulls-file "${pulls_file}")
                  done
                  source_sha="$(node scripts/docs/promotion-resolver.cjs find-promotion \
                      --upstream-sha "${GITHUB_SHA}" \
                      "${pulls_args[@]}")"
                  upstream_commit_file="${RUNNER_TEMP}/upstream-commit.json"
                  curl --fail --silent --show-error --location \
                      --connect-timeout 10 \
                      --max-time 45 \
                      --header "Authorization: Bearer ${GITHUB_TOKEN}" \
                          --header 'Accept: application/vnd.github+json' \
                          --header 'X-GitHub-Api-Version: 2022-11-28' \
                          --output "${upstream_commit_file}" \
                          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}"
                  source_commit_file="${RUNNER_TEMP}/authoring-commit.json"
                  public_get \
                      "${GITHUB_API_URL}/repos/theGeekist/wpkernel-1/git/commits/${source_sha}" \
                      "${source_commit_file}"
                  IFS=$'\t' read -r source_sha source_tree < <(
                      node scripts/docs/promotion-resolver.cjs resolve-promotion \
                          --upstream-sha "${GITHUB_SHA}" \
                          --upstream-commit-file "${upstream_commit_file}" \
                          --source-commit-file "${source_commit_file}" \
                          "${pulls_args[@]}"
                  )

                  ci_api_url="${GITHUB_API_URL}/repos/theGeekist/wpkernel-1/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=${source_sha}&per_page=100"
                  # Ten polls with 710 seconds of scheduled wait. Request
                  # timeouts and workflow overhead are additional.
                  poll_wait_delays_seconds=(15 20 30 45 60 90 120 150 180)
                  poll_attempts=$((${#poll_wait_delays_seconds[@]} + 1))
                  for (( attempt = 1; attempt <= poll_attempts; attempt += 1 )); do
                      ci_file="${RUNNER_TEMP}/authoring-ci-${attempt}.json"
                      public_get "${ci_api_url}&poll=${attempt}" "${ci_file}"
                      ci_result="$(node scripts/docs/promotion-resolver.cjs select-ci \
                          --source-sha "${source_sha}" \
                          --response-file "${ci_file}")"
                      IFS=$'\t' read -r ci_state ci_run_id ci_run_url <<< "${ci_result}"

                      case "${ci_state}" in
                          success)
                              printf 'source-sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
                              printf 'source-ci-run-id=%s\n' "${ci_run_id}" >> "${GITHUB_OUTPUT}"
                              printf 'source-ci-run-url=%s\n' "${ci_run_url}" >> "${GITHUB_OUTPUT}"
                              {
                                  echo '### Documentation promotion receipt'
                                  echo
                                  echo "- Upstream revision: \`${GITHUB_SHA}\`"
                                  echo "- Authoring revision: \`${source_sha}\`"
                                  echo "- Tree: \`${source_tree}\`"
                                  echo "- Authoring CI: ${ci_run_url}"
                              } >> "${GITHUB_STEP_SUMMARY}"
                              exit 0
                              ;;
                          failure)
                              echo "Authoring CI run ${ci_run_url} failed for ${source_sha}." >&2
                              exit 1
                              ;;
                      esac

                      if (( attempt < poll_attempts )); then
                          sleep "${poll_wait_delays_seconds[attempt - 1]}"
                      fi
                  done

                  echo "Authoring CI did not complete for ${source_sha}." >&2
                  exit 1

    build:
        name: Build promoted authoring documentation
        needs: resolve-source
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Check out promoted authoring source
              uses: actions/checkout@v4
              with:
                  repository: theGeekist/wpkernel-1
                  ref: ${{ needs.resolve-source.outputs.source-sha }}
                  fetch-depth: 1
                  persist-credentials: false

            - name: Verify checked-out source
              shell: bash
              env:
                  SOURCE_SHA: ${{ needs.resolve-source.outputs.source-sha }}
              run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: Cache node_modules
              id: cache-node-modules
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      examples/*/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      node-modules-${{ runner.os }}-

            - name: Install dependencies
              if: steps.cache-node-modules.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

            - name: Build documentation
              run: pnpm docs:build

            - name: Upload built documentation
              uses: actions/upload-artifact@v4
              with:
                  name: authoring-docs-site
                  path: docs/.vitepress/dist
                  if-no-files-found: error
                  retention-days: 1

    deploy:
        name: Deploy promoted documentation
        needs:
            - resolve-source
            - build
        runs-on: ubuntu-latest
        permissions:
            actions: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Download built documentation
              uses: actions/download-artifact@v4
              with:
                  name: authoring-docs-site
                  path: ${{ runner.temp }}/authoring-docs-site

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ runner.temp }}/authoring-docs-site

            - name: Record deployment receipt
              shell: bash
              env:
                  SOURCE_CI_RUN_ID: ${{ needs.resolve-source.outputs.source-ci-run-id }}
                  SOURCE_CI_RUN_URL: ${{ needs.resolve-source.outputs.source-ci-run-url }}
                  SOURCE_SHA: ${{ needs.resolve-source.outputs.source-sha }}
              run: |
                  {
                      echo '### Documentation deployment receipt'
                      echo
                      echo "- Authoring revision: \`${SOURCE_SHA}\`"
                      echo "- Authoring CI run: [${SOURCE_CI_RUN_ID}](${SOURCE_CI_RUN_URL})"
                  } >> "${GITHUB_STEP_SUMMARY}"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
